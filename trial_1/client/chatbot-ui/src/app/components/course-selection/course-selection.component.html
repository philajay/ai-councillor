<div class="overlay">
  <div class="selection-container">
    <h2>Select Your Course Level</h2>
    <div class="card-container">
      <div class="card" (click)="selectCourseLevel('UG')">
        <h3>Undergraduate</h3>
        <p>For students seeking a bachelor's degree.</p>
      </div>
      <div class="card" (click)="selectCourseLevel('PG')">
        <h3>Postgraduate</h3>
        <p>For students seeking a master's degree or higher.</p>
      </div>
    </div>
  </div>
</div>
