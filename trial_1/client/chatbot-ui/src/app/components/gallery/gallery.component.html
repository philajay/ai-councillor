<div class="carousel-container">
  <button mat-icon-button class="carousel-control" (click)="previous()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <img class="carousel-image" [src]="currentImage" alt="Image">
  <button mat-icon-button class="carousel-control" (click)="next()">
    <mat-icon>arrow_forward</mat-icon>
  </button>
</div>
