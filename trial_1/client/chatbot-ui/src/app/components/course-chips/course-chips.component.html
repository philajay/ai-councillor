<div class="course-selector">
  <div class="selector-header" (click)="toggle($event)">
    <span>View Eligible Courses</span>
    <mat-icon [class.rotated]="!isExpanded">expand_less</mat-icon>
  </div>

  @if (isExpanded) {
  <div class="courses-list">
    @for (course of courses; track course; let i = $index) {
    <button class="course-item" [ngClass]="'chip-color-' + (i % 5)" (click)="onChipClick(course)">
      {{ course }}
    </button>
    }
  </div>
  }
</div>
