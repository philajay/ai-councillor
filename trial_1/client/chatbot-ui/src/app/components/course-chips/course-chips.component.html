<div class="course-chips-container">
  <div class="chips-header">
    <h1 class="chips-title">What courses are you interested in studying?</h1>
    <p class="chips-subtitle">To help you find your perfect fit, please choose from the following broad fields of study</p>
  </div>
  <div class="chips-grid">
    @for (course of courses; track course; let i = $index) {
      <div class="chip-container">
        <div class="chip" [ngClass]="'gradient-' + (i % 4)" [class.is-flipped]="flipped.has(course)">
          <div class="chip-front">
            <span class="chip-title">{{ course }}</span>
            <button class="chip-button" (click)="toggleFlip(course)">Explore</button>
          </div>
          <div class="chip-back">
            <button class="chip-button" (click)="onShowCareers(course)">Show Careers</button>
            <button class="chip-button" (click)="onShowCourses(course)">Show Courses</button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
