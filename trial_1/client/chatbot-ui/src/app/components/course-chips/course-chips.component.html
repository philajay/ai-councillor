<div class="course-chips-container">
  <div class="chips-header">
    <h1 class="chips-title">What courses are you interested in studying?</h1>
    <p class="chips-subtitle">To help you find your perfect fit, please choose from the following broad fields of study</p>
  </div>
  <div class="chips-grid">
    @for (course of courses; track course; let i = $index) {
      <div class="chip" (click)="onChipClick(course)" [ngClass]="'gradient-' + (i % 4)">
        <span class="chip-title">{{ course }}</span>
      </div>
    }
  </div>
</div>
